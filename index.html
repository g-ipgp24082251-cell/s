    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8ebe6 0%, #a1c4fd 50%, #c2e9fb 100%);
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Animated Floating Particles */
        .bg-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            animation: floatUp 8s infinite linear;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.3) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.1) rotate(360deg); opacity: 0; }
        }

        /* 3D Box Glow & Floating Effect */
        .box-3d {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .box-3d:hover {
            transform: translateY(-12px) scale(1.05) rotateX(8deg);
            filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.25));
        }

        /* Pulse Animation */
        .pulse-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1)); transform: scale(1.03); }
        }

        /* Star Avatar Floating & Mouth Speaking Animation */
        .star-float {
            animation: starFloat 3s infinite ease-in-out;
        }

        @keyframes starFloat {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .speaking-mouth {
            animation: mouthTalk 0.25s infinite alternate;
        }

        @keyframes mouthTalk {
            0% { rx: 8; ry: 3; }
            100% { rx: 5; ry: 10; }
        }

        /* Custom Glassmorphic Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 4px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(31, 38, 135, 0.15);
        }

        /* Custom Confetti Effect */
        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 12px;
            top: -20px;
            animation: confettiFall 4s ease-in-out infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
